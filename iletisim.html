<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim - Murat VIP</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* İletişim Sayfasına Özel Tasarım */
        .contact-container {
            max-width: 500px;
            margin: 40px auto;
            padding: 25px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .contact-container h1 {
            color: #333;
            margin-bottom: 25px;
            font-size: 24px;
            border-bottom: 2px solid #f39c12;
            padding-bottom: 10px;
        }

        .contact-info {
            font-size: 18px;
            color: #444;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .contact-info strong {
            color: #1a1a1a;
        }

        /* Tıklanabilir Telefon Linki Stili */
        .phone-link {
            display: inline-block;
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
            font-size: 20px;
            margin-top: 5px;
            transition: color 0.2s ease;
        }

        .phone-link:hover {
            color: #0056b3;
            text-decoration: underline;
        }

        /* WhatsApp Bölüm Stili */
        .whatsapp-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .whatsapp-link {
            display: inline-block;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .whatsapp-link:hover {
            transform: scale(1.05); /* Tıklamada hafif büyütme efekti */
        }

        .whatsapp-img {
            width: 70px;
            height: 70px;
            object-fit: contain;
        }

        .whatsapp-text {
            display: block;
            margin-top: 8px;
            color: #25d366;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- Üst Navigasyon Barı ve Hamburger Menü -->
    <header class="navbar">
        <button class="hamburger-btn" onclick="toggleMenu()" aria-label="Menüyü Aç/Kapat">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
        
        <div class="logo">Murat VIP</div>

        <nav class="nav-menu" id="navMenu">
            <ul>
                <li><a href="index.html" onclick="toggleMenu()">Anasayfa</a></li>
                <li><a href="hakkimizda.html" onclick="toggleMenu()">Hakkımızda</a></li>
                <li><a href="iletisim.html" onclick="toggleMenu()">İletişim</a></li>
            </ul>
        </nav>
    </header>

    <!-- Menü Açıldığında Arka Planı Karartma Katmanı -->
    <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>

    <!-- Dil Çeviri bölümü -->
    <div class="language-flags">
        <a href="#" onclick="changeLanguage('tr'); return false;">
            <img src="tr.png" width="24" alt="Türkçe" title="Türkçe">
        </a>
        <a href="#" onclick="changeLanguage('en'); return false;">
            <img src="us.png" width="24" alt="English" title="English">
        </a>
        <a href="#" onclick="changeLanguage('de'); return false;">
            <img src="de.png" width="24" alt="Deutsch" title="Deutsch">
        </a>
        <a href="#" onclick="changeLanguage('ru'); return false;">
            <img src="ru.png" width="24" alt="Russia" title="Russia">
        </a>
    </div>

    <!-- Google Translate Gizli Widget Alanı -->
    <div id="google_translate_element" style="display:none;"></div>

    <!-- İLETİŞİM İÇERİK ALANI -->
    <main class="contact-container">
        <h1>İletişim Bilgileri</h1>

        <div class="contact-info">
            <p><strong>Ad Soyad:</strong> Murat</p>
            <p>
                <strong>Telefon:</strong><br>
                <!-- tel: yönlendirmesi arama ekranını açar -->
                <a href="tel:05064270728" class="phone-link">0 506 427 07 28</a>
            </p>
        </div>

        <!-- WHATSAPP ALANI -->
        <div class="whatsapp-section">
            <p style="margin-bottom: 10px; color: #666;">Hızlı iletişim için WhatsApp'tan yazabilirsiniz:</p>
            <a href="https://wa.me/905064270728" target="_blank" class="whatsapp-link" title="WhatsApp ile Mesaj Gönder">
                <!-- Klasörünüzdeki whatsapp.png görseli -->
                <img src="whatsapp.png" alt="WhatsApp İletişim" class="whatsapp-img">
                <span class="whatsapp-text">WhatsApp'tan Yazın</span>
            </a>
        </div>
    </main>

    <!-- JS Kodları -->
    <script>
        // Menü Açma/Kapatma Fonksiyonu
        function toggleMenu() {
            const navMenu = document.getElementById("navMenu");
            const overlay = document.getElementById("menuOverlay");
            navMenu.classList.toggle("active");
            overlay.classList.toggle("active");
        }

        // Google Translate Fonksiyonları
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'tr',
                includedLanguages: 'tr,en,de,ru',
                autoDisplay: false
            }, 'google_translate_element');
        }

        function changeLanguage(lang) {
            var selectField = document.querySelector(".goog-te-combo");
            if (selectField) {
                selectField.value = lang;
                selectField.dispatchEvent(new Event('change'));
            }
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
