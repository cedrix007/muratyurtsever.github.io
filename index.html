<script type="text/javascript">
    function googleTranslateElementInit() {

    function changeLanguage(lang) {
        var selectField = document.querySelector(".goog-te-combo");
        if (selectField) {
            selectField.value = lang;
            selectField.dispatchEvent(new Event('change'));
        }
    }

</script>

    <!-- Seçim Menüleri ve Form -->
    <main class="form-container">
        <form id="reservationForm">
            
            <!-- 1. Combobox: Nereden -->
            <div class="form-group">
                <select id="nereden" required>
                    <option value="" disabled selected hidden>Nereden</option>
                    <option value="Aydın" class="notranslate" >Aydın</option>
                    <option value="İzmir" class="notranslate" >İzmir</option>
                </select>
            </div>

            <!-- 2. Combobox: Nereye -->
            <div class="form-group">
                <select id="nereye"  required>
                    <option value="" disabled selected hidden>Nereye</option>
                    <option value="Uşak" class="notranslate" >Uşak</option>
                    <option value="Denizli" class="notranslate" >Denizli</option>
                </select>
            </div>

            <!-- 3. Combobox: Yolcu -->
            <div class="form-group">
                <select id="yolcu"  required>
                    <option value="" disabled selected hidden>Yolcu</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>

            <!-- 4. Combobox: Tarih -->
            <div class="form-group">
                <input type="text" id="tarih" placeholder="Tarih Seçiniz" onfocus="(this.type='date')" onblur="if(!this.value)this.type='text'" required>
            </div>

            <!-- Hesapla Butonu -->
            <button type="button" class="calc-btn" onclick="calculatePrice()">
                Tutar Hesapla
            </button>

            <!-- Hesaplanan Tutar Gösterge Alanı -->
            <div id="resultBox" class="result-box" style="display: none;">
                Hesaplanan Tutar: <span id="totalPrice">0</span> TL
            </div>
			
			<input type="text" id="ad" name="ad" placeholder="Adınız">&nbsp;
			<input type="text" id="soyad" name="soyad" placeholder="Soyadınız">&nbsp;
			<input type="text" id="telno" name="telno" placeholder="Telefon Numaranız">&nbsp;
			<input type="text" id="eposta" name="eposta" placeholder="Email Adresiniz">&nbsp;

            <!-- WhatsApp Butonu -->
            <button type="button" class="whatsapp-btn" onclick="sendWhatsAppMessage()">
               Randevu Al
			   
			   
		

        </form>
    </main>

    <script>
	
	function toggleMenu() {
    // HTML'deki id değerleriyle elemanları yakalıyoruz
    const navMenu = document.getElementById("navMenu");
    const overlay = document.getElementById("menuOverlay");

    // 'active' sınıfı varsa siler, yoksa ekler (toggle işlemi)
    navMenu.classList.toggle("active");
    overlay.classList.toggle("active");
}
	
	
        // Şehirler arası km matrisi
        const distances = {
            "Aydın-Uşak": 200,
            "Aydın-Denizli": 125,
            "İzmir-Uşak": 210,
            "İzmir-Denizli": 240
        };

        let calculatedTotal = null;

        function calculatePrice() {
            const nereden = document.getElementById("nereden").value;
            const nereye = document.getElementById("nereye").value;
            const yolcu = parseInt(document.getElementById("yolcu").value);

            if (!nereden || !nereye || isNaN(yolcu)) {
                alert("Lütfen hesaplama yapabilmek için Nereden, Nereye ve Yolcu alanlarını seçiniz.");
                return;
            }

            const routeKey = `${nereden}-${nereye}`;
            const km = distances[routeKey] || 0;

            // Hesaplama Mantığı:
            // (KM * 5 TL) + (Yolcu Sayısı * 50 TL) + 300 TL Sabit Ücret
            const kmFee = km * 5;
            const passengerFee = yolcu * 50;
            calculatedTotal = kmFee + passengerFee + 300;

            // Sonucu Ekrana Yazdırma
            document.getElementById("totalPrice").innerText = calculatedTotal;
            document.getElementById("resultBox").style.display = "block";
        }

        function sendWhatsAppMessage() {
            const nereden = document.getElementById("nereden").value;
            const nereye = document.getElementById("nereye").value;
            const yolcu = document.getElementById("yolcu").value;
            const tarih = document.getElementById("tarih").value;
			const ad1=document.getElementById("ad").value;
			const soyad1=document.getElementById("soyad").value;
			const telno1=document.getElementById("telno").value;
			const eposta1=document.getElementById("eposta").value;
			

            if (!nereden || !nereye || !yolcu || !tarih) {
                alert("Lütfen tüm alanları doldurunuz.");
                return;
            }

            const dateParts = tarih.split("-");
            const formattedDate = `${dateParts[2]}.${dateParts[1]}.${dateParts[0]}`;

            let message = `Nereden: ${nereden}\n\nNereye: ${nereye}\n\nYolcu Sayısı: ${yolcu}\n\nTarih: ${formattedDate}\n\nAdı: ${ad1}\n\nSoyadı: ${soyad1}\n\nTelNo: ${telno1}\n\nEposta: ${eposta1}`;
            
            if (calculatedTotal !== null) {
                message += `\n\nHesaplanan Tutar: ${calculatedTotal} TL`;
            }

            const phoneNumber = "905064270728";
            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;

            window.open(whatsappUrl, '_blank');
        }
    </script>
